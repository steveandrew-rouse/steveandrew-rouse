    <text x="70" y="62" font-family="monospace" font-size="12" fill="#5bff7e" opacity="0.8" letter-spacing="1">root@monarch:~$ ./init --mode ai-monarch --uplink secure</text>
    <text x="70" y="92" font-family="monospace" font-size="12" fill="#00ff41" opacity="0.45" letter-spacing="3">[ PERSONAL INTELLIGENCE INFRASTRUCTURE // EPOCH 2026 ]</text>

