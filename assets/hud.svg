<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Steve Andrew Rouse — AI Monarch holographic terminal">
  <title>STEVE ANDREW ROUSE // AI MONARCH</title>
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="0.52" stop-color="#f2fff4"/>
      <stop offset="1" stop-color="#00a32b"/>
    </linearGradient>
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#00ff41" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e6ffe9" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0d4a20" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect x="4" y="4" width="1192" height="332" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="#000000"/>

