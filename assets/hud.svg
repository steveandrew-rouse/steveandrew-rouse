      <text x="330" y="278" fill="#00ff41" opacity="0.75">SYSTEMS :: 15 REGISTERED</text>
      <text x="330" y="298" fill="#00ff41" opacity="0.4">SHIPPED :: 02 / 15</text>
      <text x="640" y="278" fill="#00ff41" opacity="0.75">MODELS :: LOCAL + CONNECTED</text>
      <text x="640" y="298" fill="#00ff41" opacity="0.4">MEMORY :: FUSION / RAM 8S</text>
