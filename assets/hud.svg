      <g transform="translate(104,0) rotate(90)" opacity="0.55">
        <text>10110100101101001011010010110100101101001011010010110100101101001011010010110100
          <animateTransform attributeName="transform" type="translate" values="0 -960;0 960" dur="9s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(178,0) rotate(90)" opacity="0.28">
        <text>00110001001100100011001100110100001101010011011000110111001110000011100100110001
          <animateTransform attributeName="transform" type="translate" values="-760 0;760 0" dur="15s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(252,0) rotate(90)" opacity="0.45">
        <text>11001101001100101100110100110010110011010011001011001101001100101100110100110010
