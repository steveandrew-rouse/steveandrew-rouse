        </text>
      </g>
      <g transform="translate(952,0) rotate(90)" opacity="0.3">
        <text>01110100011010000110010101110010011001010110100101110011011011100110111101110011
          <animateTransform attributeName="transform" type="translate" values="-820 0;820 0" dur="14s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(1024,0) rotate(90)" opacity="0.55">
        <text>11110000101000001111000010100000111100001010000011110000101000001111000010100000
          <animateTransform attributeName="transform" type="translate" values="0 -900;0 900" dur="11s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(1100,0) rotate(90)" opacity="0.34">
        <text>010000010100100101001101010011110100111001000001010100100100001101001000
          <animateTransform attributeName="transform" type="translate" values="-700 0;700 0" dur="16s" repeatCount="indefinite"/>
        </text>
      </g>
